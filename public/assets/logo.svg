<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" fill="none">
  <defs>
    <linearGradient id="wrapperBody" x1="24" y1="34" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="wrapperRuffle" x1="20" y1="22" x2="108" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="fillingGrad" x1="34" y1="24" x2="94" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE4C4" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
  </defs>

  <!-- Soft outer white/cream sticker rim so the dark vector outline pops on both dark red and cream backgrounds -->
  <path
    d="M24 44 C17 37, 21 25, 31 24 C35 17, 46 15, 53 19 C59 15, 69 15, 75 19 C82 15, 93 17, 97 24 C107 25, 111 37, 104 44 C107 52, 106 72, 100 84 C94 95, 81 100, 64 100 C47 100, 34 95, 28 84 C22 72, 21 52, 24 44 Z"
    fill="#FFFDF7"
    stroke="#FFFDF7"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Back Ruffled Wonton Wrapper Crown -->
  <path
    d="M24 41 C18 35, 22 25, 32 25 C36 18, 46 16, 53 20 C59 16, 69 16, 75 20 C82 16, 92 18, 96 25 C106 25, 110 35, 104 41 Z"
    fill="url(#wrapperRuffle)"
    stroke="#4A0D0E"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- Savory Pork & Shrimp Filling Dome -->
  <ellipse
    cx="64"
    cy="38"
    rx="34"
    ry="15"
    fill="url(#fillingGrad)"
    stroke="#4A0D0E"
    stroke-width="4.2"
  />

  <!-- Filling texture accents -->
  <path
    d="M42 36 C45 33, 50 33, 53 36"
    stroke="#E09F67"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <path
    d="M75 37 C78 34, 83 34, 86 37"
    stroke="#E09F67"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Main Siomai Pleated Body -->
  <path
    d="M25 43 C31 49, 41 47, 46 43 C52 48, 60 48, 64 44 C68 48, 76 48, 82 43 C87 47, 97 49, 103 43 C106 53, 105 72, 99 84 C93 94, 80 99, 64 99 C48 99, 35 94, 29 84 C23 72, 22 53, 25 43 Z"
    fill="url(#wrapperBody)"
    stroke="#4A0D0E"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- Highlight on left side of wrapper -->
  <path
    d="M31 53 C29 64, 31 76, 36 84"
    stroke="#FEF08A"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Symmetrical Dumpling Pleat Folds -->
  <path
    d="M46 44 C43 58, 44 74, 48 87"
    stroke="#4A0D0E"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path
    d="M64 46 C64 60, 64 75, 64 89"
    stroke="#4A0D0E"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path
    d="M82 44 C85 58, 84 74, 80 87"
    stroke="#4A0D0E"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Warm shadow creases next to pleats -->
  <path
    d="M50 49 C48 61, 49 74, 52 85"
    stroke="#B45309"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.45"
  />
  <path
    d="M68 50 C68 62, 68 75, 68 86"
    stroke="#B45309"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Top Orange Roe / Tobiko Garnish Cluster (Perfectly Centered) -->
  <g stroke="#4A0D0E" stroke-width="3.2">
    <circle cx="57" cy="34" r="5.5" fill="#F97316" />
    <circle cx="71" cy="34" r="5.5" fill="#F97316" />
    <circle cx="64" cy="29" r="5.8" fill="#FB923C" />
    <circle cx="53" cy="39" r="5.2" fill="#EA580C" />
    <circle cx="75" cy="39" r="5.2" fill="#EA580C" />
    <circle cx="64" cy="40" r="5.8" fill="#F97316" />
    <circle cx="64" cy="35" r="5.6" fill="#FB923C" />
  </g>

  <!-- Crisp Specular Highlights on Roe -->
  <circle cx="62.5" cy="27.5" r="1.5" fill="#FFF7ED" />
  <circle cx="55.5" cy="32.5" r="1.4" fill="#FFF7ED" />
  <circle cx="69.5" cy="32.5" r="1.4" fill="#FFF7ED" />
  <circle cx="62.5" cy="33.8" r="1.6" fill="#FFF7ED" />
</svg>
